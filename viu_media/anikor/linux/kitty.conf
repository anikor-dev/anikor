# ANI.KOR's own kitty window (written by `anikor setup-linux`, refreshed after every update).
# Used only by the ANI.KOR launcher: your normal kitty.conf is not read or changed.

font_family      CaskaydiaCove Nerd Font Mono
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.0

background_opacity         0.45
dynamic_background_opacity yes
# blurs the desktop behind the glass on KDE/macOS (Hyprland/GNOME use their own blur, if any)
background_blur            32

window_padding_width  25
remember_window_size  no
initial_window_width  1440
initial_window_height 900

cursor_trail             1
enable_audio_bell        no
confirm_os_window_close  0

foreground              #FFFFFF
background              #2A2A3A
selection_foreground    #2A2A3A
selection_background    #FFFFFF
cursor                  #F1D9C2
cursor_text_color       #060606
color0      #292952
color8      #57578F
color1      #FFE5CC
color9      #F0CCAA
color2      #D2CCFF
color10     #B2AAF0
color3      #FFDACC
color11     #F0BDAA
color4      #9A9AE6
color12     #9A9AE6
color5      #A29AE6
color13     #A29AE6
color6      #E6AE9A
color14     #E6AE9A
color7      #FFE5CC
color15     #F0CCAA
