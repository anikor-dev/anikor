[project]
name = "anikor"
version = "0.1.1"
description = "ANI.KOR — a MyAnimeList-style anime dashboard for the terminal, built on Viu"
license = "Unlicense"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "click>=8.1.7",
  "httpx>=0.28.1",
  "inquirerpy>=0.3.4",
  "pycryptodomex>=3.23.0",
  "pydantic>=2.11.7",
  "rich>=13.9.2",
  # Viu's "standard" extras
  "thefuzz>=0.22.1",
  "yt-dlp>=2025.7.21",
  "plyer>=2.1.0",
  "lxml>=6.0.0",
  "pypiwin32; sys_platform == 'win32'",
  # ANI.KOR dashboard
  "textual==8.2.8",
  "textual-image==0.14.4",
  "pillow>=10",
]

[project.urls]
Homepage = "https://github.com/anikor-dev/anikor"

[project.scripts]
anikor = "viu_media.anikor.cli:main"
viu = "viu_media:Cli"

[project.optional-dependencies]
linux = ["dbus-python; sys_platform == 'linux'"]
mpv = ["mpv>=1.0.7"]
discord = ["pypresence>=4.3.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["viu_media"]

[tool.hatch.build.targets.sdist]
include = ["viu_media", "README.md", "LICENSE", "DISCLAIMER.md"]

[dependency-groups]
dev = [
  "pytest>=8.3.3",
  "pytest-httpx>=0.35.0",
  "ruff>=0.6.9",
]

[tool.pytest.ini_options]
markers = [
  "integration: marks tests as integration tests that require a live network connection",
]
